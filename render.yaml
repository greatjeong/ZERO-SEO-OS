# Reviewed before applying: these are paid resources. No secret values in Git.
services:
  - type: web
    name: zero-seo-os
    runtime: python
    region: singapore
    plan: starter
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install -r backend/requirements-central.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: uvicorn central:create_app --factory --app-dir backend --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: zero-seo-os-db
          property: connectionString
      - key: ZERO_OWNER_PASSWORD
        sync: false

databases:
  - name: zero-seo-os-db
    databaseName: zero_seo_os
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: '18'
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: []
